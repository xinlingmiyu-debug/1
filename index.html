<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>灵鹿网盘搜</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-gradient: linear-gradient(145deg, #f0f8ff 0%, #e9f5f0 100%);
            --card-bg: rgba(255, 255, 255, 0.94);
            --text-primary: #1e3a3a;
            --text-secondary: #547a6b;
            --accent-primary: #2c9b77;
            --accent-soft: #48c9a7;
            --shadow-sm: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
            --shadow-md: 0 20px 25px -12px rgba(0, 0, 0, 0.1);
            --border-radius-card: 28px;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', 'SF Pro Text', Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 0 16px 40px 16px;
        }

        .top-rainbow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #2c9b77, #48c9a7, #7ed6b0, #b8e1cc, #d4f1e9);
            z-index: 200;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding-top: 28px;
        }

        .hero-card {
            background: var(--card-bg);
            backdrop-filter: blur(2px);
            border-radius: 56px;
            padding: 28px 24px 32px;
            margin-bottom: 24px;
            text-align: center;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(90, 180, 140, 0.3);
            transition: all 0.2s;
        }

        .hero-title {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            background: linear-gradient(130deg, #1f8a6b, #3dae86, #5fc7a3);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        .sub-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(44, 155, 119, 0.12);
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #2c9b77;
            margin-bottom: 20px;
        }

        .avatar-area {
            display: flex;
            justify-content: center;
            margin: 8px 0 12px 0;
        }
        .cute-avatar {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #b7e4cf, #7ed6b0);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 12px 20px -12px rgba(44, 155, 119, 0.3);
            border: 3px solid white;
        }

        /* 修改区域：将搜索按钮放置在搜索框下方，垂直排列 */
        .search-wrapper {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 16px;
        }
        .search-input {
            width: 100%;
            padding: 16px 24px;
            font-size: 1rem;
            border: 1.5px solid #cfe8de;
            border-radius: 60px;
            background: rgba(255, 255, 255, 0.85);
            color: #1e3a3a;
            font-weight: 500;
            outline: none;
            transition: all 0.2s;
        }
        .search-input:focus {
            border-color: #2c9b77;
            box-shadow: 0 0 0 4px rgba(44, 155, 119, 0.2);
            background: white;
        }
        .search-btn {
            background: linear-gradient(100deg, #2c9b77, #1f8a6b);
            border: none;
            border-radius: 60px;
            padding: 14px 20px;
            font-weight: 700;
            font-size: 1rem;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 8px 18px -8px rgba(44, 155, 119, 0.4);
            width: 100%;
        }
        .search-btn:active {
            transform: scale(0.97);
        }

        /* 筛选栏 */
        .filter-section {
            margin: 24px 0 28px 0;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            padding: 8px 12px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(100, 180, 140, 0.4);
        }
        .filter-icon {
            font-size: 0.9rem;
            font-weight: 600;
            background: #e0f3ec;
            padding: 5px 12px;
            border-radius: 40px;
            color: #2c9b77;
        }
        .filter-chip {
            background: #edf6f2;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            color: #235b4a;
            border: none;
        }
        .filter-chip.active {
            background: #2c9b77;
            color: white;
            box-shadow: 0 6px 12px -8px #2c9b77;
        }
        .clear-filter {
            background: rgba(0,0,0,0.03);
            border: 1px solid #cfe0d8;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            color: #5e8b7a;
        }

        /* 分页控件 */
        .pagination-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin: 32px 0 20px;
            flex-wrap: wrap;
        }
        .page-btn {
            background: #f0faf5;
            border: none;
            padding: 8px 18px;
            border-radius: 44px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            color: #2c9b77;
            border: 1px solid #cbe8dd;
        }
        .page-btn.active-page {
            background: #2c9b77;
            color: white;
            border-color: #2c9b77;
            box-shadow: 0 4px 10px rgba(44,155,119,0.2);
        }
        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .page-number-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .page-info {
            background: #e4f3ec;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #2f6b57;
        }

        .results-grid {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .resource-card {
            background: var(--card-bg);
            border-radius: 28px;
            overflow: hidden;
            transition: all 0.2s;
            border: 1px solid rgba(150, 210, 170, 0.4);
            box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.06);
        }
        .card-inner {
            padding: 20px 22px;
        }
        .res-title {
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1.35;
            margin-bottom: 12px;
            color: #1f4e3f;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .disk-badge {
            background: #e0f2ea;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #278a69;
        }
        .meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 14px;
        }
        .meta-chip {
            background: #eff7f2;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #4e7b68;
        }
        .password-chip {
            background: #fff0e0;
            color: #d48c3b;
        }
        .note-text {
            background: #f9fffcf;
            padding: 12px 14px;
            border-radius: 22px;
            font-size: 0.8rem;
            color: #507a69;
            margin: 12px 0;
            border-left: 3px solid #7ed6b0;
            word-break: break-word;
        }
        .link-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(95deg, #2c9b77, #238a66);
            color: white;
            text-decoration: none;
            padding: 12px 0;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            width: 100%;
            margin-top: 8px;
            transition: 0.2s;
        }
        .footer-meta {
            display: flex;
            justify-content: space-between;
            padding: 12px 22px;
            background: rgba(210, 235, 220, 0.4);
            font-size: 0.7rem;
            color: #6d9a86;
            border-top: 1px solid #cae5d9;
        }
        .empty-state, .error-state {
            background: rgba(255, 255, 245, 0.9);
            border-radius: 48px;
            padding: 48px 24px;
            text-align: center;
            color: #689f8a;
            margin-top: 20px;
        }
        .loading-state {
            background: rgba(255, 248, 240, 0.9);
            border-radius: 48px;
            padding: 48px 20px;
            text-align: center;
        }
        .spinner-dual {
            width: 48px;
            height: 48px;
            margin: 0 auto;
            border: 4px solid #cfe8de;
            border-top-color: #2c9b77;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 550px) {
            body { padding: 0 12px 32px 12px; }
            .hero-card { padding: 22px 18px 28px; }
            .hero-title { font-size: 1.7rem; }
            .filter-chip { padding: 6px 14px; font-size: 0.75rem; }
            .card-inner { padding: 16px 18px; }
            .res-title { font-size: 1rem; }
            .page-btn { padding: 6px 14px; font-size: 0.75rem; }
            .search-btn { padding: 12px 20px; }
        }
    </style>
</head>
<body>
<div class="top-rainbow"></div>
<div class="container">
    <div class="hero-card">
        <div class="avatar-area">
            <div class="cute-avatar">
                🦌
            </div>
        </div>
        <div class="hero-title">灵鹿·网盘搜</div>
        <div class="sub-badge">
            <span>📀 百度 · 阿里 · 夸克 · 迅雷</span>
        </div>
        <div class="search-wrapper">
            <input type="text" id="searchInput" class="search-input" placeholder="搜电影、短剧、书籍、资料… 例：蜜语纪 死神来了">
            <button id="searchBtn" class="search-btn"> 灵鹿搜 </button>
        </div>
    </div>

    <!-- 筛选栏 -->
    <div id="filterArea" style="display: none;">
        <div class="filter-section" id="filterBarSection">
            <span class="filter-icon">📂 网盘筛选</span>
            <div id="filterChipsContainer" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
            <button id="clearFilterBtn" class="clear-filter">清除 ✖️</button>
        </div>
    </div>

    <div id="resultsContainer" class="results-grid">
        <div class="empty-state">
            🦌 灵鹿全网盘搜<br>
            💡 试试搜索「短剧」「电影」「死神来了」<br>
            
        </div>
    </div>

    <!-- 分页容器 -->
    <div id="paginationContainer" style="display: none;"></div>
</div>

<script>
    (function() {
        // ----- 配置（代理保留）-----
        const ORIGIN_API = 'https://so.252035.xyz/api/search?kw=';
        const PROXY_API = 'https://proxy.api.030101.xyz/';
        const USE_PROXY = true;
        const PAGE_SIZE = 10;   // 每页10条

        function buildApiUrl(keyword) {
            const encodedKw = encodeURIComponent(keyword);
            if (USE_PROXY) return PROXY_API + ORIGIN_API + encodedKw;
            return ORIGIN_API + encodedKw;
        }

        let currentFilterType = 'all';      // 'all' 或具体网盘名
        let currentRawResults = [];           // 当前搜索的所有原始结果
        let currentKeyword = '';
        let currentPage = 1;                  // 当前页码
        
        const cache = new Map();

        // 网盘识别
        function getDiskTypeWithEmoji(url) {
            if (!url) return '🔗 链接';
            if (url.includes('pan.baidu.com')) return '📀 百度网盘';
            if (url.includes('aliyundrive.com')) return '☁️ 阿里云盘';
            if (url.includes('quark.cn')) return '⚛️ 夸克网盘';
            if (url.includes('xunlei.com') || url.includes('pan.xunlei.com')) return '⚡ 迅雷网盘';
            return '🔗 网盘链接';
        }

        function getPureDiskType(url) {
            const type = getDiskTypeWithEmoji(url);
            if (type.includes('百度')) return '百度网盘';
            if (type.includes('阿里')) return '阿里云盘';
            if (type.includes('夸克')) return '夸克网盘';
            if (type.includes('迅雷')) return '迅雷网盘';
            return '其他';
        }

        function extractDiskTypesFromResults(results) {
            const set = new Set();
            for (const item of results) {
                const pure = getPureDiskType(item.url);
                if (pure !== '其他') set.add(pure);
            }
            const order = ['百度网盘', '阿里云盘', '夸克网盘', '迅雷网盘'];
            return order.filter(t => set.has(t));
        }

        // 渲染筛选栏（保留原有逻辑）
        function renderFilterBar(typesArray) {
            const filterArea = document.getElementById('filterArea');
            const chipsContainer = document.getElementById('filterChipsContainer');
            if (!chipsContainer) return;
            if (!typesArray || typesArray.length === 0) {
                filterArea.style.display = 'none';
                return;
            }
            filterArea.style.display = 'block';
            chipsContainer.innerHTML = '';

            const totalCount = currentRawResults.length;
            const allChip = document.createElement('button');
            allChip.className = `filter-chip ${currentFilterType === 'all' ? 'active' : ''}`;
            allChip.textContent = `🌈 全部 (${totalCount})`;
            allChip.addEventListener('click', () => {
                currentFilterType = 'all';
                currentPage = 1;
                applyFilterAndRenderWithPagination();
                updateActiveFilterUI();
            });
            chipsContainer.appendChild(allChip);

            typesArray.forEach(type => {
                const count = currentRawResults.filter(item => getPureDiskType(item.url) === type).length;
                const chip = document.createElement('button');
                chip.className = `filter-chip ${currentFilterType === type ? 'active' : ''}`;
                let icon = '';
                if (type === '百度网盘') icon = '📀';
                else if (type === '阿里云盘') icon = '☁️';
                else if (type === '夸克网盘') icon = '⚛️';
                else if (type === '迅雷网盘') icon = '⚡';
                chip.textContent = `${icon} ${type} (${count})`;
                chip.addEventListener('click', () => {
                    currentFilterType = type;
                    currentPage = 1;
                    applyFilterAndRenderWithPagination();
                    updateActiveFilterUI();
                });
                chipsContainer.appendChild(chip);
            });
        }

        function updateActiveFilterUI() {
            const chips = document.querySelectorAll('.filter-chip');
            chips.forEach(chip => {
                const rawText = chip.textContent;
                if (currentFilterType === 'all' && rawText.includes('全部')) {
                    chip.classList.add('active');
                } else if (currentFilterType !== 'all' && rawText.includes(currentFilterType)) {
                    chip.classList.add('active');
                } else {
                    chip.classList.remove('active');
                }
            });
        }

        // 获取当前筛选后的结果集
        function getFilteredResults() {
            if (!currentRawResults.length) return [];
            if (currentFilterType === 'all') return [...currentRawResults];
            return currentRawResults.filter(item => getPureDiskType(item.url) === currentFilterType);
        }

        // 渲染当前页 + 分页控件
        function applyFilterAndRenderWithPagination() {
            const filteredAll = getFilteredResults();
            if (filteredAll.length === 0) {
                const filterName = currentFilterType === 'all' ? '全部' : currentFilterType;
                resultsContainer.innerHTML = `<div class="empty-state">✨ 当前“${filterName}”下没有资源～<br>试试清除筛选或换个关键词 🦌</div>`;
                const paginationDiv = document.getElementById('paginationContainer');
                if (paginationDiv) paginationDiv.style.display = 'none';
                return;
            }

            const totalPages = Math.ceil(filteredAll.length / PAGE_SIZE);
            // 边界修正
            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages) currentPage = totalPages;
            
            const start = (currentPage - 1) * PAGE_SIZE;
            const end = start + PAGE_SIZE;
            const pageItems = filteredAll.slice(start, end);
            
            renderResultsCard(pageItems);
            renderPaginationControls(filteredAll.length, totalPages);
        }

        function renderResultsCard(results) {
            if (!results.length) {
                resultsContainer.innerHTML = `<div class="empty-state">🍃 当前页无结果，试试其他页码～</div>`;
                return;
            }
            let html = '';
            for (let item of results) {
                const title = item.note || '📄 资源链接';
                const url = item.url || '#';
                const password = item.password || '';
                const source = item.source || '灵鹿聚合';
                const datetime = formatDateNice(item.datetime);
                const diskFull = getDiskTypeWithEmoji(url);
                const noteDetail = item.note || '';
                const hasPassword = password ? `<span class="meta-chip password-chip">🔑 提取码 ${escapeHtml(password)}</span>` : '';
                
                html += `
                    <div class="resource-card">
                        <div class="card-inner">
                            <div class="res-title">
                                ${escapeHtml(title).substring(0, 80)}${escapeHtml(title).length > 80 ? '…' : ''}
                                <span class="disk-badge">${diskFull}</span>
                            </div>
                            <div class="meta-row">
                                <span class="meta-chip">📅 ${datetime}</span>
                                <span class="meta-chip">📡 ${escapeHtml(source)}</span>
                                ${hasPassword}
                            </div>
                            ${noteDetail && noteDetail !== title ? `<div class="note-text">📄 ${escapeHtml(noteDetail.substring(0, 150))}${noteDetail.length > 150 ? '…' : ''}</div>` : ''}
                            <a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" class="link-button">🔗 打开资源链接 →</a>
                        </div>
                        <div class="footer-meta">
                            <span>✨ ${escapeHtml(source)}</span>
                            ${password ? `<span>🔐 密码: ${escapeHtml(password)}</span>` : '<span>🔓 无提取码</span>'}
                        </div>
                    </div>
                `;
            }
            resultsContainer.innerHTML = html;
        }

        function renderPaginationControls(totalItems, totalPages) {
            const paginationDiv = document.getElementById('paginationContainer');
            if (!paginationDiv) return;
            if (totalPages <= 1) {
                paginationDiv.style.display = 'none';
                return;
            }
            paginationDiv.style.display = 'block';
            let controlsHtml = `<div class="pagination-bar">
                <button class="page-btn" id="prevPageBtn" ${currentPage === 1 ? 'disabled' : ''}>◀ 上一页</button>
                <div class="page-number-group">`;
            
            // 显示页码逻辑: 最多显示5个页码，当前居中
            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, startPage + 4);
            if (endPage - startPage < 4) startPage = Math.max(1, endPage - 4);
            
            for (let p = startPage; p <= endPage; p++) {
                controlsHtml += `<button class="page-btn ${p === currentPage ? 'active-page' : ''}" data-page="${p}">${p}</button>`;
            }
            
            controlsHtml += `</div>
                <button class="page-btn" id="nextPageBtn" ${currentPage === totalPages ? 'disabled' : ''}>下一页 ▶</button>
                <span class="page-info">第 ${currentPage} / ${totalPages} 页 (共 ${totalItems} 条)</span>
            </div>`;
            paginationDiv.innerHTML = controlsHtml;
            
            // 绑定页码点击事件
            document.querySelectorAll('[data-page]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const page = parseInt(btn.getAttribute('data-page'), 10);
                    if (!isNaN(page) && page !== currentPage) {
                        currentPage = page;
                        applyFilterAndRenderWithPagination();
                    }
                });
            });
            const prevBtn = document.getElementById('prevPageBtn');
            const nextBtn = document.getElementById('nextPageBtn');
            if (prevBtn) prevBtn.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    applyFilterAndRenderWithPagination();
                }
            });
            if (nextBtn) nextBtn.addEventListener('click', () => {
                const maxPage = Math.ceil(getFilteredResults().length / PAGE_SIZE);
                if (currentPage < maxPage) {
                    currentPage++;
                    applyFilterAndRenderWithPagination();
                }
            });
        }

        function formatDateNice(dateStr) {
            if (!dateStr || dateStr.startsWith('0001')) return '日期未知';
            try {
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr.split('T')[0];
                return `${d.getFullYear()}.${(d.getMonth()+1).toString().padStart(2,'0')}.${d.getDate().toString().padStart(2,'0')}`;
            } catch(e) { return '近期'; }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function renderEmptyState(kw) {
            if (kw) {
                resultsContainer.innerHTML = `<div class="empty-state">🍃 没有找到关于 “${escapeHtml(kw)}” 的资源<br>💡 试试其他关键词: 短剧，死神来了，热播电影</div>`;
            } else {
                resultsContainer.innerHTML = `<div class="empty-state">🦌 灵鹿搜·输入关键词，智能分类网盘资源<br>支持百度/阿里/夸克/迅雷 | 每页10条清爽展示</div>`;
            }
            document.getElementById('filterArea').style.display = 'none';
            const paginationDiv = document.getElementById('paginationContainer');
            if (paginationDiv) paginationDiv.style.display = 'none';
        }

        function showLoadingSpinner() {
            resultsContainer.innerHTML = `<div class="loading-state"><div class="spinner-dual"></div><div style="margin-top:16px; color:#2c9b77;">⚡ 灵鹿加速检索中 · 稍等片刻</div></div>`;
            document.getElementById('filterArea').style.display = 'none';
            const paginationDiv = document.getElementById('paginationContainer');
            if (paginationDiv) paginationDiv.style.display = 'none';
        }

        async function fetchWithTimeout(url, timeout = 8000, retries = 1) {
            let lastErr;
            for (let i = 0; i <= retries; i++) {
                try {
                    const controller = new AbortController();
                    const tid = setTimeout(() => controller.abort(), timeout);
                    const res = await fetch(url, { signal: controller.signal, headers: { 'Accept': 'application/json' } });
                    clearTimeout(tid);
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();
                    return data;
                } catch (err) {
                    lastErr = err;
                    if (i < retries) await new Promise(r => setTimeout(r, 500));
                }
            }
            throw lastErr;
        }

        async function searchResources(keyword) {
            const kw = keyword.trim();
            if (!kw) {
                renderEmptyState('');
                return;
            }
            currentKeyword = kw;
            currentFilterType = 'all';
            currentPage = 1;
            
            if (cache.has(kw)) {
                const cached = cache.get(kw);
                currentRawResults = cached.allResults;
                const types = extractDiskTypesFromResults(currentRawResults);
                renderFilterBar(types);
                applyFilterAndRenderWithPagination();
                return;
            }
            
            showLoadingSpinner();
            try {
                const apiUrl = buildApiUrl(kw);
                const data = await fetchWithTimeout(apiUrl, 8000, 1);
                if (data.code !== 0 || !data.data) throw new Error(data.message || '接口异常');
                const merged = data.data.merged_by_type || {};
                let allResults = [];
                for (let type in merged) {
                    if (Array.isArray(merged[type])) allResults = allResults.concat(merged[type]);
                }
                if (allResults.length === 0) {
                    renderEmptyState(kw);
                    currentRawResults = [];
                    document.getElementById('filterArea').style.display = 'none';
                    return;
                }
                currentRawResults = allResults;
                cache.set(kw, { allResults });
                if (cache.size > 50) {
                    const first = cache.keys().next().value;
                    cache.delete(first);
                }
                const diskTypes = extractDiskTypesFromResults(allResults);
                renderFilterBar(diskTypes);
                applyFilterAndRenderWithPagination();
            } catch (err) {
                console.warn(err);
                resultsContainer.innerHTML = `<div class="error-state">⚠️ 请求失败: ${err.message || '网络波动'}<br>点击重试或稍后再试～</div>`;
                document.getElementById('filterArea').style.display = 'none';
                const paginationDiv = document.getElementById('paginationContainer');
                if (paginationDiv) paginationDiv.style.display = 'none';
            }
        }

        function silentWarmup() {
            const warmWords = ['短剧', '电影'];
            if ('requestIdleCallback' in window) {
                requestIdleCallback(() => {
                    warmWords.forEach(w => {
                        if (!cache.has(w)) fetchWithTimeout(buildApiUrl(w), 10000, 0).catch(() => {});
                    });
                });
            } else {
                setTimeout(() => {
                    warmWords.forEach(w => {
                        if (!cache.has(w)) fetchWithTimeout(buildApiUrl(w), 10000, 0).catch(() => {});
                    });
                }, 1500);
            }
        }

        // 绑定UI
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const clearFilterBtn = document.getElementById('clearFilterBtn');
        
        searchBtn.addEventListener('click', () => searchResources(searchInput.value));
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchResources(searchInput.value);
        });
        
        if (clearFilterBtn) {
            clearFilterBtn.addEventListener('click', () => {
                if (currentRawResults.length) {
                    currentFilterType = 'all';
                    currentPage = 1;
                    applyFilterAndRenderWithPagination();
                    const types = extractDiskTypesFromResults(currentRawResults);
                    renderFilterBar(types);
                    updateActiveFilterUI();
                } else {
                    currentFilterType = 'all';
                    document.getElementById('filterArea').style.display = 'none';
                }
            });
        }
        
        silentWarmup();
    })();
</script>
<div id="paginationContainer"></div>
</body>
</html>
